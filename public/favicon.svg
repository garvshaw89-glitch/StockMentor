<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Luxury Background Pill/Shield -->
  <rect width="64" height="64" rx="16" fill="#050607"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#borderGlow)" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Subtle Grid Pattern in background -->
  <path d="M8 24H56M8 40H56M24 8V56M40 8V56" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.35"/>
  
  <!-- Candlestick 1: Bullish / Emerald (Left/Lower) -->
  <line x1="20" y1="22" x2="20" y2="46" stroke="#10B981" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="16.5" y="27" width="7" height="13" rx="1.5" fill="#10B981" filter="url(#glowGreen)"/>

  <!-- Candlestick 2: Consolidation / Slate (Center) -->
  <line x1="32" y1="18" x2="32" y2="44" stroke="#6F9BFF" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="28.5" y="24" width="7" height="12" rx="1.5" fill="#3B82F6" filter="url(#glowBlue)"/>

  <!-- Candlestick 3: Surge Bullish / Bright Intelligence Emerald (Right) -->
  <line x1="44" y1="12" x2="44" y2="38" stroke="#6EE7B7" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="40.5" y="15" width="7" height="15" rx="1.5" fill="#6EE7B7" filter="url(#glowEmerald)"/>

  <!-- Trending Spline Line through the market -->
  <path d="M14 43 C 20 40, 24 33, 32 28 C 38 24, 42 20, 50 14" stroke="url(#trendGradient)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- AI Socratic Beacon Sparkle on peak -->
  <circle cx="50" cy="14" r="3.5" fill="#8B7CFF" filter="url(#sparkleGlow)"/>
  <circle cx="50" cy="14" r="1.5" fill="#FFFFFF"/>

  <!-- Gradients & Glow Filters -->
  <defs>
    <linearGradient id="borderGlow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6F9BFF" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#8B7CFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6EE7B7" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="trendGradient" x1="14" y1="43" x2="50" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="0.6" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <filter id="glowGreen" x="12" y="22" width="16" height="23" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>

    <filter id="glowBlue" x="24" y="19" width="16" height="22" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#3B82F6" flood-opacity="0.45"/>
    </filter>

    <filter id="glowEmerald" x="36" y="10" width="16" height="25" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#6EE7B7" flood-opacity="0.5"/>
    </filter>

    <filter id="sparkleGlow" x="42" y="6" width="16" height="16" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#8B7CFF" flood-opacity="0.8"/>
    </filter>
  </defs>
</svg>
